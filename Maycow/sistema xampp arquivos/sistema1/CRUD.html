<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de Usuário</title>
</head>
<body>
    
    <!-- Botão de alternância de tema -->
    <button class="btn-tema" onclick="alternarTema()">🌙 Alternar Tema</button>

    <h1>Cadastro do usuário</h1>
    
    <form action="CRUD.php" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Escreva o seu nome">

        <label for="matricula">Matricula:</label>
        <input type="text" id="matricula" name="matricula" placeholder="Escreva a sua matricula">

        <label for="funcao">Função:</label>
        <input type="text" id="funcao" name="funcao" placeholder="Escreva a sua função">

        <label for="departamento">Departamento:</label>
        <input type="text" id="departamento" name="departamento" placeholder="Escreva o seu departamento">

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" placeholder="Escreva a sua idade">

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="Escreva o seu CPF">

        <label for="rg">RG:</label>
        <input type="text" id="rg" name="rg" placeholder="Escreva o seu RG">

        <label for="salario">Salário:</label>
        <input type="number" id="salario" name="salario" placeholder="Escreva o seu salário">

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco" placeholder="Escreva o seu endereco">

        <label for="uf">UF:</label>
        <input type="text" id="uf" name="uf" placeholder="Escreva o seu uf">

        <label for="pais">País:</label>
        <input type="text" id="pais" name="pais" placeholder="Qual o seu país">

        <button type="submit">Gravar</button>
    </form>

    <!-- Script para trocar o tema -->
    <script>
        function alternarTema() {
            // Alterna a classe 'tema-escuro' no body
            document.body.classList.toggle('tema-escuro');
            
            // Troca o ícone e texto do botão
            const btn = document.querySelector('.btn-tema');
            if(document.body.classList.contains('tema-escuro')) {
                btn.innerHTML = '☀️ Alternar Tema';
            } else {
                btn.innerHTML = '🌙 Alternar Tema';
            }
        }
    </script>
</body>
</html>
