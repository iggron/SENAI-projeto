<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </title>Formulário</title>

    <link rel="stylesheet" href="style.css">

    </head>
    <body>

        <h1>Cadastro de Usuário</h1>

        <form action="cadastro.php" method= "post">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="digite o seu nome">
            
            <br><br>

            <label for="endereço">Endereço:</label>
            <input type="text" id="endereço" name="endereço" placeholder="digite o seu endereço">

            <br><br>
            
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="digite o seu telefone">

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="digite o seu email">

            <br><br>

            <button type="submit">Gravar</button>

        </form>

    <body>
    </html>
