<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telefilms - Cadastrar Filme</title>
    <link rel="stylesheet" href="estilo_filmes.css">
</head>
<body>
    <div class="container">
        <h1>Cadastrar Filme</h1>

        <nav class="nav-bar">
            <a href="cadastro_filme.html" class="nav-link active">Cadastrar Filme</a>
            <a href="consultar_filme.php" class="nav-link">Consultar Catálogo</a>
        </nav>

        <form action="inserir_filme.php" method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label for="titulo">Título do Filme *</label>
                    <input type="text" id="titulo" name="titulo" required placeholder="Ex: Interestelar">
                </div>

                <div class="form-group">
                    <label for="genero">Gênero *</label>
                    <input type="text" id="genero" name="genero" required placeholder="Ex: Ficção Científica">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="diretor">Diretor *</label>
                    <input type="text" id="diretor" name="diretor" required placeholder="Ex: Christopher Nolan">
                </div>

                <div class="form-group">
                    <label for="duracao_minutos">Duração (minutos)</label>
                    <input type="number" id="duracao_minutos" name="duracao_minutos" placeholder="Ex: 169">
                </div>

                <div class="form-group">
                    <label for="data_lancamento">Lançamento</label>
                    <input type="date" id="data_lancamento" name="data_lancamento">
                </div>
            </div>

            <div class="form-group">
                <label for="sinopse">Sinopse</label>
                <textarea id="sinopse" name="sinopse" rows="4" placeholder="Escreva uma breve sinopse do filme..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Cadastrar Filme</button>
        </form>
    </div>
</body>
</html>
