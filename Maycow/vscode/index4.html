<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Snake Game</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .score-board {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    canvas {
      border: 3px solid #333;
      background-color: #000;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
    }

    .controls-hint {
      margin-top: 12px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="score-board">Score: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls-hint">Use Arrow Keys or WASD to Move</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameLoop = null;
    let changingDirection = false;

    document.addEventListener('keydown', handleKeyPress);
    resetGame();

    function main() {
      if (hasGameEnded()) {
        alert(`Game Over! Your final score: ${score}`);
        resetGame();
        return;
      }

      changingDirection = false;
      clearCanvas();
      drawFood();
      moveSnake();
      drawSnake();
    }

    function clearCanvas() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      snake.forEach((part, index) => {
        // Head is a brighter shade
        ctx.fillStyle = index === 0 ? '#00ff88' : '#00cc66';
        ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
      });
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      
      // Prevent snake from shrinking at start before any movement
      if (dx === 0 && dy === 0) return;

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);

      // Re-generate if food spawns on top of snake body
      snake.forEach(part => {
        if (part.x === food.x && part.y === food.y) {
          generateFood();
        }
      });
    }

    function drawFood() {
      ctx.fillStyle = '#ff3366';
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
    }

    function handleKeyPress(e) {
      if (changingDirection) return;

      const key = e.key.toLowerCase();
      const goingUp = dy === -1;
      const goingDown = dy === 1;
      const goingRight = dx === 1;
      const goingLeft = dx === -1;

      if ((key === 'arrowleft' || key === 'a') && !goingRight) {
        dx = -1; dy = 0; changingDirection = true;
      }
      if ((key === 'arrowup' || key === 'w') && !goingDown) {
        dx = 0; dy = -1; changingDirection = true;
      }
      if ((key === 'arrowright' || key === 'd') && !goingLeft) {
        dx = 1; dy = 0; changingDirection = true;
      }
      if ((key === 'arrowdown' || key === 's') && !goingUp) {
        dx = 0; dy = 1; changingDirection = true;
      }
    }

    function hasGameEnded() {
      if (dx === 0 && dy === 0) return false;

      const head = snake[0];

      // Wall collision
      const hitLeft = head.x < 0;
      const hitRight = head.x >= tileCount;
      const hitTop = head.y < 0;
      const hitBottom = head.y >= tileCount;

      if (hitLeft || hitRight || hitTop || hitBottom) return true;

      // Self collision
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) return true;
      }

      return false;
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 0;
      dy = 0;
      score = 0;
      scoreElement.textContent = score;
      generateFood();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(main, 100);
    }
  </script>
</body>
</html>
