<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Katana Square - Mega Flame & The Creator</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0; padding: 0; background: #06070a; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    #ui {
      position: absolute; top: 20px; display: flex; align-items: center; gap: 18px;
      font-size: 17px; font-weight: 800; letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0,240,255,0.6); z-index: 10;
    }
    #flame-container {
      display: flex; gap: 5px; align-items: center;
      background: rgba(10,15,26,0.85); padding: 5px 12px; border-radius: 22px;
      border: 2px solid rgba(0,240,255,0.4);
      box-shadow: 0 0 18px rgba(0,240,255,0.25);
    }
    .flame-slot { width: 22px; height: 28px; display: flex; align-items: center; justify-content: center; }
    .flame-icon {
      width: 20px; height: 26px; fill: #121824;
      transition: all 0.25s cubic-bezier(0.175,0.885,0.32,1.275);
    }
    .flame-icon.active {
      fill: #00f0ff;
      filter: drop-shadow(0 0 8px #00f0ff) drop-shadow(0 0 14px #0066ff);
      animation: flameFlicker 0.4s infinite alternate ease-in-out;
    }
    #mega-container {
      display: flex; gap: 7px; align-items: center;
      background: rgba(20,10,35,0.85); padding: 5px 12px; border-radius: 22px;
      border: 2px solid rgba(180,0,255,0.5); box-shadow: 0 0 18px rgba(180,0,255,0.3);
    }
    .mega-node {
      width: 15px; height: 15px; border-radius: 50%; background: #1a1228;
      border: 2px solid #552288; transition: all 0.3s ease;
    }
    .mega-node.active {
      background: #00ffff; border-color: #fff;
      box-shadow: 0 0 12px #00ffff, 0 0 22px #b400ff; transform: scale(1.25);
    }
    @keyframes flameFlicker {
      0% { transform: scale(1.1) rotate(-4deg); }
      100% { transform: scale(1.3) rotate(4deg); }
    }
    #e-ability-ui, #q-ability-ui {
      background: rgba(10,15,26,0.85); padding: 7px 14px; border-radius: 18px;
      border: 2px solid rgba(0,240,255,0.4); font-size: 14px; color: #00f0ff;
      box-shadow: 0 0 12px rgba(0,240,255,0.2);
    }
    #e-ability-ui.cooldown, #q-ability-ui.disabled {
      color: #556677; border-color: rgba(255,255,255,0.1); box-shadow: none;
    }
    #q-ability-ui.ready {
      color: #fff; border-color: rgba(0,255,255,0.85);
      box-shadow: 0 0 20px rgba(0,255,255,0.55);
      animation: pulseReady 0.8s infinite alternate;
    }
    @keyframes pulseReady {
      0% { box-shadow: 0 0 14px rgba(0,255,255,0.4); }
      100% { box-shadow: 0 0 28px rgba(0,255,255,0.9); }
    }
    #boss-ui {
      position: absolute; top: 68px; display: none; flex-direction: column; align-items: center; gap: 5px; z-index: 10;
      background: rgba(20,5,15,0.92); padding: 9px 22px; border-radius: 14px;
      border: 2px solid #ff0066; box-shadow: 0 0 22px rgba(255,0,100,0.4);
    }
    #boss-name { font-size: 18px; font-weight: 900; color: #ff3388; letter-spacing: 2px; text-shadow: 0 0 10px #ff0066; }
    #boss-hp-bar { width: 300px; height: 12px; background: #1a0a12; border-radius: 7px; overflow: hidden; border: 1px solid #ff0066; }
    #boss-hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg,#ff0066,#ff66aa,#ff0066); transition: width 0.15s ease; }
    canvas {
      border: 2px solid #1f2430;
      box-shadow: 0 0 40px rgba(0,0,0,0.9), 0 0 18px rgba(0,240,255,0.15);
      background: #0d0e14; cursor: crosshair;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>HP: <span id="hp" style="color:#00f0ff">100</span></div>
    <div>COMBO: <span id="combo" style="color:#ffaa00">0x</span></div>
    <div>SCORE: <span id="score" style="color:#ff0055">0</span></div>
    <div id="flame-container"></div>
    <div id="mega-container" title="Fill 3 mega nodes then press Q">
      <div class="mega-node"></div><div class="mega-node"></div><div class="mega-node"></div>
    </div>
    <div id="e-ability-ui">[E] PHANTOM DASH</div>
    <div id="q-ability-ui" class="disabled">[Q] MEGA (0/3)</div>
  </div>
  <div id="boss-ui">
    <div id="boss-name">THE CREATOR</div>
    <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
  </div>
  <canvas id="gameCanvas" width="900" height="650"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const hpEl = document.getElementById('hp');
const comboEl = document.getElementById('combo');
const scoreEl = document.getElementById('score');
const flameContainer = document.getElementById('flame-container');
const eAbilityUi = document.getElementById('e-ability-ui');
const qAbilityUi = document.getElementById('q-ability-ui');
const bossUi = document.getElementById('boss-ui');
const bossHpFill = document.getElementById('boss-hp-fill');

const flameIcons = [];
for (let i = 0; i < 6; i++) {
  const slot = document.createElement('div');
  slot.className = 'flame-slot';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'flame-icon');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.innerHTML = `<path d="M12,2C11.5,5 10,7 8,9C6,11 5,13.5 5,16C5,19.86 8.14,23 12,23C15.86,23 19,19.86 19,16C19,12 16,8 12,2Z"/>`;
  slot.appendChild(svg);
  flameContainer.appendChild(slot);
  flameIcons.push(svg);
}
const megaNodes = Array.from(document.querySelectorAll('.mega-node'));
let megaFlameCount = 0;

function updateFlamesUI() {
  flameIcons.forEach((icon, idx) => icon.classList.toggle('active', idx < player.flames));
  megaNodes.forEach((node, idx) => node.classList.toggle('active', idx < megaFlameCount));

  if (megaFlameCount >= 3 && !ultimateState.active && !megaState.active && !cutscene.active) {
    qAbilityUi.classList.remove('disabled');
    qAbilityUi.classList.add('ready');
    qAbilityUi.textContent = '[Q] MEGA ULTIMATE READY';
  } else {
    qAbilityUi.classList.remove('ready');
    qAbilityUi.classList.add('disabled');
    qAbilityUi.textContent = `[Q] MEGA (${megaFlameCount}/3)`;
  }
}

let score = 0, combo = 0, comboTimer = 0, gameOver = false, frameCount = 0;
let hitStopFrames = 0, slowMoTimer = 0, bossSpawnTimer = 0;
const BOSS_SPAWN_INTERVAL = 1200;

let isMouseDown = false, holdTimer = 0;
const HOLD_THRESHOLD = 16;

let screenShake = 0;
const particles = [], floatingTexts = [], shockwaves = [], travelingSlashes = [];
const arcSlashes = [], fullScreenSlashes = [], glassCracks = [], queuedAfterSlashes = [];
const bossShards = [];

const BLUE_PALETTE = ['#00f0ff','#00c3ff','#0088ff','#00e5ff','#33f0ff','#ffffff'];

const ultimateState = { active:false, barrageCount:0, timer:0, maxBigPause:28, phase:'NONE', isMega:false };
const megaState = { active:false, phase:'NONE', timer:0 };
const cutscene = { active:false, phase:'NONE', timer:0, bossRef:null, textIndex:0 };

const keys = { w:false, a:false, s:false, d:false, e:false, q:false };
const mouse = { x: canvas.width/2, y: canvas.height/2 };

const player = {
  x: canvas.width/2, y: canvas.height/2, vx:0, vy:0, size:24,
  accel:0.85, friction:0.82, hp:100, angle:0, flames:0,
  eCooldown:0, eCooldownMax:120, isAttacking:false, attackTimer:0,
  attackDuration:12, swingDir:1, isParrying:false, parryTimer:0,
  parryDuration:18, parryCooldown:0, trail:[]
};

const enemies = [];
let boss = null;

window.addEventListener('contextmenu', e => e.preventDefault());

function resetGame() {
  score=0; combo=0; comboTimer=0; gameOver=false; frameCount=0;
  hitStopFrames=0; slowMoTimer=0; screenShake=0; isMouseDown=false;
  holdTimer=0; megaFlameCount=0; bossSpawnTimer=0; boss=null;
  bossUi.style.display='none';

  ultimateState.active=false; ultimateState.barrageCount=0;
  ultimateState.timer=0; ultimateState.phase='NONE';
  megaState.active=false; megaState.phase='NONE'; megaState.timer=0;
  cutscene.active=false; cutscene.phase='NONE'; cutscene.timer=0;
  cutscene.bossRef=null; cutscene.textIndex=0;

  player.hp=100; player.flames=0; player.eCooldown=0;
  player.x=canvas.width/2; player.y=canvas.height/2;
  player.vx=0; player.vy=0; player.isAttacking=false;
  player.isParrying=false; player.parryCooldown=0; player.trail=[];

  enemies.length=0; particles.length=0; floatingTexts.length=0;
  shockwaves.length=0; travelingSlashes.length=0; arcSlashes.length=0;
  fullScreenSlashes.length=0; glassCracks.length=0; queuedAfterSlashes.length=0;
  bossShards.length=0;

  hpEl.textContent=100; scoreEl.textContent=0; comboEl.textContent='0x';
  updateFlamesUI();
}

window.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
window.addEventListener('mousedown', e => {
  if (gameOver || ultimateState.active || megaState.active || cutscene.active) return;
  if (e.button === 0) { isMouseDown = true; holdTimer = 0; }
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) {
    if (isMouseDown && holdTimer < HOLD_THRESHOLD && !ultimateState.active && !megaState.active && !cutscene.active) {
      triggerRegularArcSlash();
    }
    isMouseDown = false; holdTimer = 0;
  }
});

function triggerEAbility() {
  if (player.isAttacking || player.isParrying || ultimateState.active || megaState.active || cutscene.active || player.eCooldown > 0) return;
  player.eCooldown = player.eCooldownMax;
  player.flames = Math.min(6, player.flames + 2);
  updateFlamesUI();
  screenShake = 28; hitStopFrames = 3;

  const dashDistance = 220;
  const startX = player.x, startY = player.y;
  const targetX = player.x + Math.cos(player.angle) * dashDistance;
  const targetY = player.y + Math.sin(player.angle) * dashDistance;
  player.x = Math.max(player.size/2, Math.min(canvas.width - player.size/2, targetX));
  player.y = Math.max(player.size/2, Math.min(canvas.height - player.size/2, targetY));
  const endX = player.x, endY = player.y;

  spawnFloatingText(endX, endY-40, '+2 BLUE FLAMES!', '#00f0ff');
  spawnFloatingText(endX, endY-20, 'PHANTOM DASH!', '#ffffff');
  shockwaves.push({x:startX,y:startY,r:5,maxR:100,color:'#00f0ff',width:6,alpha:1});
  shockwaves.push({x:endX,y:endY,r:5,maxR:160,color:'#ffffff',width:8,alpha:1});
  fullScreenSlashes.push({x1:startX,y1:startY,x2:endX,y2:endY,life:18,maxLife:18,glowColor:'#00f0ff',coreColor:'#ffffff',width:14});

  for (let i=0;i<30;i++){
    const t=i/30;
    spawnParticle(startX+(endX-startX)*t, startY+(endY-startY)*t,
      (Math.random()-0.5)*8,(Math.random()-0.5)*8,
      BLUE_PALETTE[Math.floor(Math.random()*BLUE_PALETTE.length)], Math.random()*5+3,20,true);
  }
  for (let i=0;i<24;i++){
    queuedAfterSlashes.push({
      delay:Math.floor(i*1.1)+2,
      x:startX+(endX-startX)*Math.random()+(Math.random()-0.5)*50,
      y:startY+(endY-startY)*Math.random()+(Math.random()-0.5)*50,
      angle:player.angle+(Math.random()-0.5)*1.8,
      length:Math.random()*140+90, width:Math.random()*8+4,
      glowColor:BLUE_PALETTE[Math.floor(Math.random()*BLUE_PALETTE.length)]
    });
  }
  damageEnemiesInLine(startX,startY,endX,endY,50,3);
}

function damageEnemiesInLine(x1,y1,x2,y2,radius,damage){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const A=e.x-x1,B=e.y-y1,C=x2-x1,D=y2-y1;
    const dot=A*C+B*D, len_sq=C*C+D*D;
    let param=len_sq!==0?dot/len_sq:-1;
    let xx=param<0?x1:(param>1?x2:x1+param*C);
    let yy=param<0?y1:(param>1?y2:y1+param*D);
    if(Math.hypot(e.x-xx,e.y-yy)<=radius+e.size/2) applyEnemyDamage(e,i,damage,'#00f0ff');
  }
  if(boss&&!boss.dead){
    const A=boss.x-x1,B=boss.y-y1,C=x2-x1,D=y2-y1;
    const dot=A*C+B*D, len_sq=C*C+D*D;
    let param=len_sq!==0?dot/len_sq:-1;
    let xx=param<0?x1:(param>1?x2:x1+param*C);
    let yy=param<0?y1:(param>1?y2:y1+param*D);
    if(Math.hypot(boss.x-xx,boss.y-yy)<=radius+boss.size/2) applyBossDamage(damage,'#00f0ff',false);
  }
}

function damageEnemiesNearPoint(px,py,radius,damage){
  for(let i=enemies.length-1;i>=0;i--){
    if(Math.hypot(enemies[i].x-px,enemies[i].y-py)<=radius+enemies[i].size/2)
      applyEnemyDamage(enemies[i],i,damage,'#00f0ff');
  }
  if(boss&&!boss.dead&&Math.hypot(boss.x-px,boss.y-py)<=radius+boss.size/2)
    applyBossDamage(damage,'#00f0ff',false);
}

function applyEnemyDamage(e,index,damage,sparkColor){
  e.hp-=damage; e.hitFlash=10; createSparks(e.x,e.y,sparkColor,15);
  if(e.hp<=0){
    combo++; comboTimer=120;
    const points=e.scoreValue*Math.max(1,combo);
    score+=points; scoreEl.textContent=score; comboEl.textContent=`${combo}x`;
    createSparks(e.x,e.y,e.color,30); enemies.splice(index,1);
  }
}

function applyBossDamage(damage,sparkColor,fromUltimate){
  if(!boss||boss.dead) return;
  boss.hp-=damage; boss.hitFlash=12; createSparks(boss.x,boss.y,sparkColor,25);
  updateBossUI();
  if(boss.hp<=0){
    boss.hp=0; boss.dead=true; updateBossUI();
    if(fromUltimate||ultimateState.active||megaState.active){
      startCreatorDeathCutscene();
    }else{
      combo+=5; comboTimer=180;
      const points=500*Math.max(1,combo);
      score+=points; scoreEl.textContent=score; comboEl.textContent=`${combo}x`;
      createSparks(boss.x,boss.y,'#ff0066',80); createSparks(boss.x,boss.y,'#ffffff',50);
      spawnFloatingText(boss.x,boss.y-50,'CREATOR DEFEATED!','#ff3388');
      spawnFloatingText(boss.x,boss.y-25,`+${points}`,'#ffffff');
      boss=null; bossUi.style.display='none';
    }
  }
}

function updateBossUI(){
  if(!boss){ bossUi.style.display='none'; return; }
  bossUi.style.display='flex';
  bossHpFill.style.width=Math.max(0,boss.hp/boss.maxHp)*100+'%';
}

function triggerRegularArcSlash(){
  if(player.isAttacking||player.isParrying) return;
  player.isAttacking=true; player.attackTimer=player.attackDuration;
  player.swingDir*=-1; screenShake=Math.max(screenShake,10);
  const radius=135, arcAngle=Math.PI*0.85;
  arcSlashes.push({x:player.x,y:player.y,angle:player.angle,radius,arcAngle,life:12,maxLife:12,swingDir:player.swingDir});
  shockwaves.push({x:player.x,y:player.y,r:10,maxR:90,color:'#00f0ff',width:4,alpha:0.8});
  for(let i=0;i<16;i++){
    const pAng=player.angle+(Math.random()-0.5)*arcAngle;
    const spd=Math.random()*10+6;
    spawnParticle(player.x+Math.cos(pAng)*30,player.y+Math.sin(pAng)*30,
      Math.cos(pAng)*spd,Math.sin(pAng)*spd,Math.random()<0.5?'#ffffff':'#00f0ff',Math.random()*4+2,15,true);
  }
  checkArcSlashHits(radius,arcAngle,1);
}

function checkArcSlashHits(radius,arcAngle,damage){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const edx=e.x-player.x,edy=e.y-player.y,dist=Math.hypot(edx,edy);
    if(dist<=radius+e.size/2){
      let diff=Math.atan2(edy,edx)-player.angle;
      while(diff<-Math.PI)diff+=Math.PI*2;
      while(diff>Math.PI)diff-=Math.PI*2;
      if(Math.abs(diff)<=arcAngle/2+0.3){
        e.hp-=damage; e.hitFlash=10;
        hitStopFrames=Math.max(hitStopFrames,3); screenShake=Math.max(screenShake,14);
        e.x+=Math.cos(player.angle)*35; e.y+=Math.sin(player.angle)*35;
        createSparks(e.x,e.y,'#00f0ff',22); createSparks(e.x,e.y,'#ffffff',18);
        if(e.hp<=0){
          combo++; comboTimer=120;
          const points=e.scoreValue*Math.max(1,combo);
          score+=points; scoreEl.textContent=score; comboEl.textContent=`${combo}x`;
          if(player.flames<6){player.flames++;updateFlamesUI();spawnFloatingText(e.x,e.y-30,'+1 BLUE FLAME!','#00f0ff');}
          else spawnFloatingText(e.x,e.y,`+${points}`,'#00f0ff');
          createSparks(e.x,e.y,e.color,35); enemies.splice(i,1);
        }else spawnFloatingText(e.x,e.y,'SLASH!','#ffffff');
      }
    }
  }
  if(boss&&!boss.dead){
    const edx=boss.x-player.x,edy=boss.y-player.y,dist=Math.hypot(edx,edy);
    if(dist<=radius+boss.size/2){
      let diff=Math.atan2(edy,edx)-player.angle;
      while(diff<-Math.PI)diff+=Math.PI*2;
      while(diff>Math.PI)diff-=Math.PI*2;
      if(Math.abs(diff)<=arcAngle/2+0.3){
        applyBossDamage(damage,'#00f0ff',false);
        hitStopFrames=Math.max(hitStopFrames,4); screenShake=Math.max(screenShake,18);
      }
    }
  }
}

function triggerTripleHeavyLineSlash(){
  player.flames-=2; updateFlamesUI();
  screenShake=34; hitStopFrames=4;
  createSparks(player.x,player.y,'#00f0ff',45); createSparks(player.x,player.y,'#ffffff',30);
  spawnFloatingText(player.x,player.y-35,'PHANTOM TRIPLE CUT!','#00f0ff');
  shockwaves.push({x:player.x,y:player.y,r:10,maxR:190,color:'#00f0ff',width:9,alpha:1});
  shockwaves.push({x:player.x,y:player.y,r:5,maxR:130,color:'#ffffff',width:6,alpha:1});
  [player.angle-0.25,player.angle,player.angle+0.25].forEach(ang=>{
    travelingSlashes.push({
      x:player.x+Math.cos(ang)*20,y:player.y+Math.sin(ang)*20,angle:ang,
      speed:21,width:95,damage:6,life:42,maxLife:42,lineLength:550,lineWidth:12,
      glowColor:'#00f0ff',coreColor:'#ffffff',hitEnemies:new Set(),fromUltimate:false
    });
    for(let p=0;p<12;p++){
      const spd=Math.random()*14+5;
      spawnParticle(player.x,player.y,Math.cos(ang)*spd+(Math.random()-0.5)*5,Math.sin(ang)*spd+(Math.random()-0.5)*5,
        BLUE_PALETTE[Math.floor(Math.random()*BLUE_PALETTE.length)],Math.random()*5+3,22,true);
    }
  });
}

function triggerQuintupleHeavyLineSlash(){
  player.flames-=4; updateFlamesUI();
  screenShake=48; hitStopFrames=5;
  createSparks(player.x,player.y,'#00f0ff',70); createSparks(player.x,player.y,'#ffffff',50);
  spawnFloatingText(player.x,player.y-45,'PENTA DOMINION CUT!!','#00f0ff');
  shockwaves.push({x:player.x,y:player.y,r:10,maxR:280,color:'#00f0ff',width:12,alpha:1});
  shockwaves.push({x:player.x,y:player.y,r:10,maxR:210,color:'#33f0ff',width:8,alpha:1});
  shockwaves.push({x:player.x,y:player.y,r:5,maxR:140,color:'#ffffff',width:10,alpha:1});
  const angles=[player.angle-0.42,player.angle-0.21,player.angle,player.angle+0.21,player.angle+0.42];
  angles.forEach((ang,idx)=>{
    travelingSlashes.push({
      x:player.x+Math.cos(ang)*20,y:player.y+Math.sin(ang)*20,angle:ang,
      speed:24,width:120,damage:9,life:48,maxLife:48,lineLength:700,lineWidth:16,
      glowColor:BLUE_PALETTE[idx%BLUE_PALETTE.length],coreColor:'#ffffff',hitEnemies:new Set(),fromUltimate:false
    });
    for(let k=1;k<=3;k++){
      queuedAfterSlashes.push({
        delay:k*3+idx*2,x:player.x+Math.cos(ang)*(k*110),y:player.y+Math.sin(ang)*(k*110),
        angle:ang+(Math.random()-0.5)*0.8,length:150,width:8,glowColor:BLUE_PALETTE[k%BLUE_PALETTE.length]
      });
    }
  });
}

// HOLD 6 FLAMES → normal Realm Cutter + fill one mega node
function triggerSixFlameHoldAttack(){
  player.flames=0;
  megaFlameCount=Math.min(3,megaFlameCount+1);
  updateFlamesUI();

  ultimateState.active=true;
  ultimateState.barrageCount=0;
  ultimateState.timer=0;
  ultimateState.phase='BARRAGE';
  ultimateState.isMega=false;

  spawnFloatingText(canvas.width/2,canvas.height/2-100,`REALM CUTTER (${megaFlameCount}/3 MEGA CHARGE)!`,'#00f0ff');
  startNextBarrage();
}

// Q → Mega Ultimate (requires 3/3)
function triggerMegaWithQ(){
  if(megaFlameCount<3||megaState.active||ultimateState.active||cutscene.active) return;
  megaFlameCount=0;
  updateFlamesUI();
  triggerMegaFlameUltimate();
}

function startNextBarrage(){
  ultimateState.barrageCount++;
  ultimateState.phase='BARRAGE';
  ultimateState.timer=8;
  screenShake=32;
  const count=Math.floor(Math.random()*8)+25;
  for(let i=0;i<count;i++) spawnRandomFullScreenSlash(BLUE_PALETTE[Math.floor(Math.random()*BLUE_PALETTE.length)],'#ffffff',Math.random()*8+4);
  for(let k=0;k<3;k++) spawnEnemyInsideCanvas();
  damageAllEnemies(3,true);
}

function spawnRandomFullScreenSlash(glowColor,coreColor,width=6){
  const angle=Math.random()*Math.PI*2;
  const cx=Math.random()*canvas.width, cy=Math.random()*canvas.height;
  const len=Math.max(canvas.width,canvas.height)*1.5;
  const x1=cx-Math.cos(angle)*len, y1=cy-Math.sin(angle)*len;
  const x2=cx+Math.cos(angle)*len, y2=cy+Math.sin(angle)*len;
  fullScreenSlashes.push({x1,y1,x2,y2,life:12,maxLife:12,glowColor,coreColor,width});
  for(let k=0;k<4;k++){
    const t=Math.random();
    const px=x1+(x2-x1)*t, py=y1+(y2-y1)*t;
    if(px>=0&&px<=canvas.width&&py>=0&&py<=canvas.height){
      spawnParticle(px,py,(Math.random()-0.5)*12,(Math.random()-0.5)*12,glowColor,Math.random()*4+2,15,true);
    }
  }
}

function triggerFinalSlashAndScreenBreak(){

function triggerMegaFlameUltimate(){

  megaState.phase='CHARGE_UP';

}

function generateGlassCracks(){
  glassCracks.length=0;
  const cx=canvas.width/2, cy=canvas.height/2;
  for(let i=0;i<16;i++){
    const baseAngle=(i/16)*Math.PI*2+(Math.random()-0.5)*0.3;
    let currX=cx, currY=cy, dist=0;
    const crackSegments=[];
    while(dist<canvas.width){
      const step=Math.random()*35+15;
      dist+=step;
      const angle=baseAngle+(Math.random()-0.5)*0.5;
      const nextX=currX+Math.cos(angle)*step;
      const nextY=currY+Math.sin(angle)*step;
      crackSegments.push({x1:currX,y1:currY,x2:nextX,y2:nextY});
      currX=nextX; currY=nextY;
      if(Math.random()<0.5){
        const branchAngle=angle+(Math.random()<0.5?0.75:-0.75);
        const branchLen=Math.random()*55+20;
        crackSegments.push({x1:currX,y1:currY,x2:currX+Math.cos(branchAngle)*branchLen,y2:currY+Math.sin(branchAngle)*branchLen});
      }
    }
    glassCracks.push(crackSegments);
  }
}

function damageAllEnemies(damage,fromUltimate=false){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.hp-=damage; e.hitFlash=12; createSparks(e.x,e.y,'#00f0ff',15);
    if(e.hp<=0){
      combo++; comboTimer=120;
      const points=e.scoreValue*Math.max(1,combo);
      score+=points; scoreEl.textContent=score; comboEl.textContent=`${combo}x`;
      createSparks(e.x,e.y,e.color,25); enemies.splice(i,1);
    }
  }
  if(boss&&!boss.dead) applyBossDamage(damage,'#00f0ff',fromUltimate);
}

function obliterateAllEnemies(){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    combo++; comboTimer=120;
    const points=e.scoreValue*Math.max(1,combo);
    score+=points; scoreEl.textContent=score; comboEl.textContent=`${combo}x`;
    createSparks(e.x,e.y,'#00ffff',25); createSparks(e.x,e.y,'#ffffff',20);
    spawnFloatingText(e.x,e.y,'OBLITERATED!','#00f0ff');
    enemies.splice(i,1);
  }
  if(boss&&!boss.dead) applyBossDamage(999,'#00ffff',true);
}

function spawnTheCreator(){
  if(boss&&!boss.dead) return;
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=-60;y=Math.random()*canvas.height;}
  else if(side===1){x=canvas.width+60;y=Math.random()*canvas.height;}

  boss={x,y,size:56,hp:80,maxHp:80,speed:1.15,color:'#ff0066',hitFlash:0,dead:false,pulseTimer:0,id:'creator'};

  screenShake=25;
  spawnFloatingText(canvas.width/2,80,'THE CREATOR HAS ENTERED THE REALM!','#ff3388');

}

function updateCutscene(){
  if(!cutscene.active) return;
  cutscene.timer--;

  if(cutscene.phase==='FOCUS'){
    screenShake=Math.max(screenShake,15);
    if(cutscene.bossRef){
      for(let i=0;i<10;i++){
        const ang=Math.random()*Math.PI*2, dist=Math.random()*220+60;
        const px=cutscene.bossRef.x+Math.cos(ang)*dist;
        const py=cutscene.bossRef.y+Math.sin(ang)*dist;
        spawnParticle(px,py,(cutscene.bossRef.x-px)*0.13,(cutscene.bossRef.y-py)*0.13,'#00ffff',Math.random()*6+3,20,true);
      }
    }
    if(cutscene.timer<=0){ cutscene.phase='DIALOGUE'; cutscene.timer=160; }
  }
  else if(cutscene.phase==='DIALOGUE'){
    screenShake=Math.max(screenShake,8);
    if(cutscene.timer===150) spawnFloatingText(canvas.width/2,canvas.height/2-90,'"You... actually used it..."','#ff66aa');
    if(cutscene.timer===115) spawnFloatingText(canvas.width/2,canvas.height/2-50,'"The Mega Flame..."','#ff3388');
    if(cutscene.timer===80)  spawnFloatingText(canvas.width/2,canvas.height/2-10,'"I was the one who created this realm."','#ff0066');
    if(cutscene.timer===45)  spawnFloatingText(canvas.width/2,canvas.height/2+30,'"And now... you will erase me."','#ff3388');
    if(cutscene.timer<=0){ cutscene.phase='SHATTER'; cutscene.timer=70; createBossShatter(); }
  }
  else if(cutscene.phase==='SHATTER'){
    screenShake=Math.max(screenShake,55);
    if(frameCount%2===0 && cutscene.bossRef){
      const ang=Math.random()*Math.PI*2, len=450;
      fullScreenSlashes.push({
        x1:cutscene.bossRef.x-Math.cos(ang)*len, y1:cutscene.bossRef.y-Math.sin(ang)*len,
        x2:cutscene.bossRef.x+Math.cos(ang)*len, y2:cutscene.bossRef.y+Math.sin(ang)*len,
        life:16, maxLife:16,
        glowColor:BLUE_PALETTE[Math.floor(Math.random()*BLUE_PALETTE.length)],
        coreColor:'#ffffff', width:Math.random()*14+10
      });
    }
    for(let i=bossShards.length-1;i>=0;i--){
      const s=bossShards[i];
      s.x+=s.vx; s.y+=s.vy; s.vy+=0.18; s.rotation+=s.rotSpeed; s.life--;
      if(s.life<=0) bossShards.splice(i,1);
    }
    if(cutscene.timer<=0){ cutscene.phase='FINAL'; cutscene.timer=100; generateGlassCracks(); }
  }
  else if(cutscene.phase==='FINAL'){
    screenShake=Math.max(screenShake,20);
    if(cutscene.timer===85) spawnFloatingText(canvas.width/2,canvas.height/2-50,'THE CREATOR...','#ff3388');
    if(cutscene.timer===55) spawnFloatingText(canvas.width/2,canvas.height/2,'HAS BEEN ERASED FROM EXISTENCE.','#00ffff');
    if(cutscene.timer===25) spawnFloatingText(canvas.width/2,canvas.height/2+45,'REALM RESTORED.','#ffffff');
    for(let i=bossShards.length-1;i>=0;i--){
      const s=bossShards[i];
      s.x+=s.vx*0.7; s.y+=s.vy*0.7; s.vy+=0.12; s.rotation+=s.rotSpeed; s.life--;
      if(s.life<=0) bossShards.splice(i,1);
    }
    if(cutscene.timer<=0){ cutscene.phase='END'; cutscene.timer=25; }
  }
  else if(cutscene.phase==='END'){
    if(cutscene.timer<=0){
      combo+=12; comboTimer=280;
      const points=2000*Math.max(1,Math.floor(combo/2));
      score+=points; scoreEl.textContent=score; comboEl.textContent=`${combo}x`;
      if(cutscene.bossRef) spawnFloatingText(cutscene.bossRef.x,cutscene.bossRef.y-70,`+${points}`,'#00ffff');
      boss=null; cutscene.bossRef=null; bossUi.style.display='none';
      glassCracks.length=0; bossShards.length=0;
      cutscene.active=false; cutscene.phase='NONE';
    }
  }
}

      player.isParrying=true; player.parryTimer=player.parryDuration; player.parryCooldown=35;

  }
  if(e.code==='KeyE'&&!gameOver&&!cutscene.active) triggerEAbility();

});

});

function update(){
  if(gameOver) return;
  if(hitStopFrames>0){hitStopFrames--;return;}
  if(slowMoTimer>0) slowMoTimer--;

  if(cutscene.active){
    updateCutscene();
    updateVisualsOnly();
    return;
  }

  if(player.eCooldown>0){
    player.eCooldown--;
    eAbilityUi.classList.add('cooldown');
    eAbilityUi.textContent=`[E] DASH (${Math.ceil(player.eCooldown/60)}s)`;
  }else{
    eAbilityUi.classList.remove('cooldown');
    eAbilityUi.textContent='[E] PHANTOM DASH';
  }

  bossSpawnTimer++;
  if(bossSpawnTimer>=BOSS_SPAWN_INTERVAL){
    bossSpawnTimer=0;
    if(!boss||boss.dead) spawnTheCreator();
  }

  for(let i=queuedAfterSlashes.length-1;i>=0;i--){
    const q=queuedAfterSlashes[i];
    q.delay--;
    if(q.delay<=0){
      screenShake=Math.max(screenShake,8);
      const halfL=q.length/2;
      fullScreenSlashes.push({
        x1:q.x-Math.cos(q.angle)*halfL,y1:q.y-Math.sin(q.angle)*halfL,
        x2:q.x+Math.cos(q.angle)*halfL,y2:q.y+Math.sin(q.angle)*halfL,
        life:10,maxLife:10,glowColor:q.glowColor,coreColor:'#ffffff',width:q.width
      });
      createSparks(q.x,q.y,q.glowColor,8);
      damageEnemiesNearPoint(q.x,q.y,65,1.5);
      queuedAfterSlashes.splice(i,1);
    }
  }

  frameCount++;
  if(frameCount%Math.max(18,48-Math.floor(score/100))===0) spawnEnemy();

  // Standard ultimate (from hold 6 flames)
  if(ultimateState.active){
    ultimateState.timer--;
    if(ultimateState.phase==='BARRAGE'){
      if(ultimateState.timer<=0){
        if(ultimateState.barrageCount<5){ultimateState.phase='PAUSE';ultimateState.timer=5;}
        else{ultimateState.phase='BIG_PAUSE';ultimateState.timer=ultimateState.maxBigPause;}
      }
    }else if(ultimateState.phase==='PAUSE'){
      if(ultimateState.timer<=0) startNextBarrage();
    }else if(ultimateState.phase==='BIG_PAUSE'){
      screenShake=Math.max(screenShake,22);
      for(let c=0;c<12;c++){
        const sang=Math.random()*Math.PI*2, sdist=Math.random()*260+80;
        spawnParticle(player.x+Math.cos(sang)*sdist,player.y+Math.sin(sang)*sdist,
          (player.x-(player.x+Math.cos(sang)*sdist))*0.16,(player.y-(player.y+Math.sin(sang)*sdist))*0.16,
          Math.random()<0.6?'#00f0ff':'#ffffff',Math.random()*7+3,12,true);
      }
      if(ultimateState.timer<=0) triggerFinalSlashAndScreenBreak();
    }else if(ultimateState.phase==='FINAL_SLASH_AND_BREAK'){
      if(ultimateState.timer<=0){ultimateState.active=false;ultimateState.phase='NONE';glassCracks.length=0;}
    }
  }

  // Mega ultimate (from Q)
  if(megaState.active){
    megaState.timer--;
    if(megaState.phase==='CHARGE_UP'){
      screenShake=Math.max(screenShake,25);
      for(let i=0;i<15;i++){
        const ang=Math.random()*Math.PI*2, dist=Math.random()*300+100;
        spawnParticle(player.x+Math.cos(ang)*dist,player.y+Math.sin(ang)*dist,
          (player.x-(player.x+Math.cos(ang)*dist))*0.14,(player.y-(player.y+Math.sin(ang)*dist))*0.14,'#00ffff',Math.random()*8+4,15,true);
      }
      if(megaState.timer<=0){
        megaState.phase='CONTINUOUS'; megaState.timer=240;
        spawnFloatingText(canvas.width/2,canvas.height/2-80,'4 SECONDS OMNI-DESTRUCTION!','#00ffff');
      }
    }else if(megaState.phase==='CONTINUOUS'){
      screenShake=Math.max(screenShake,35);
      for(let i=0;i<4;i++) spawnRandomFullScreenSlash(BLUE_PALETTE[Math.floor(Math.random()*BLUE_PALETTE.length)],'#ffffff',Math.random()*10+5);
      if(frameCount%6===0) shockwaves.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:10,maxR:250,color:'#00ffff',width:8,alpha:1});
      obliterateAllEnemies();
      if(megaState.timer<=0){megaState.phase='PAUSE';megaState.timer=40;}
    }else if(megaState.phase==='PAUSE'){
      screenShake=Math.max(screenShake,5);
      if(megaState.timer<=0){megaState.phase='SUPER_CHARGE';megaState.timer=90;}
    }else if(megaState.phase==='SUPER_CHARGE'){
      const chargeProgress=1-(megaState.timer/90);
      screenShake=10+chargeProgress*65;
      for(let i=0;i<25;i++){
        const ang=Math.random()*Math.PI*2, dist=Math.random()*(400-chargeProgress*250)+100;
        spawnParticle(player.x+Math.cos(ang)*dist,player.y+Math.sin(ang)*dist,
          (player.x-(player.x+Math.cos(ang)*dist))*(0.12+chargeProgress*0.15),
          (player.y-(player.y+Math.sin(ang)*dist))*(0.12+chargeProgress*0.15),
          Math.random()<0.5?'#ffffff':'#00ffff',Math.random()*9+4,14,true);
      }
      if(frameCount%5===0) shockwaves.push({x:player.x,y:player.y,r:10,maxR:150+chargeProgress*200,color:'#00f0ff',width:10,alpha:1});
      if(megaState.timer<=0){
        megaState.phase='FINAL_SLASH'; megaState.timer=30;
        screenShake=85; hitStopFrames=8;
        fullScreenSlashes.push({x1:-100,y1:-100,x2:canvas.width+100,y2:canvas.height+100,life:28,maxLife:28,glowColor:'#00ffff',coreColor:'#ffffff',width:55});
        fullScreenSlashes.push({x1:canvas.width+100,y1:-100,x2:-100,y2:canvas.height+100,life:28,maxLife:28,glowColor:'#33f0ff',coreColor:'#ffffff',width:35});
        generateGlassCracks();
        shockwaves.push({x:canvas.width/2,y:canvas.height/2,r:10,maxR:700,color:'#ffffff',width:25,alpha:1});
        shockwaves.push({x:canvas.width/2,y:canvas.height/2,r:10,maxR:500,color:'#00f0ff',width:18,alpha:1});
        obliterateAllEnemies();
        megaFlameCount=0; updateFlamesUI();
        spawnFloatingText(canvas.width/2,canvas.height/2-140,'DIMENSION OBLITERATED!','#ffffff');
      }
    }else if(megaState.phase==='FINAL_SLASH'){
      if(megaState.timer<=0){megaState.active=false;megaState.phase='NONE';glassCracks.length=0;}
    }
  }

  // HOLD LOGIC
  if(isMouseDown&&!player.isAttacking&&!player.isParrying&&!ultimateState.active&&!megaState.active&&!cutscene.active){
    holdTimer++;
    if(player.flames>=2&&player.flames<6){
      const pCount=player.flames>=4?4:2;
      for(let c=0;c<pCount;c++){
        const spawnAng=Math.random()*Math.PI*2, spawnDist=Math.random()*75+25;
        spawnParticle(player.x+Math.cos(spawnAng)*spawnDist,player.y+Math.sin(spawnAng)*spawnDist,
          (player.x-(player.x+Math.cos(spawnAng)*spawnDist))*0.06,(player.y-(player.y+Math.sin(spawnAng)*spawnDist))*0.06,
          Math.random()<0.7?'#00f0ff':'#ffffff',Math.random()*5+2,18,true);
      }
    }
    if(holdTimer>=HOLD_THRESHOLD){
      if(player.flames===6) triggerSixFlameHoldAttack();
      else if(player.flames>=4) triggerQuintupleHeavyLineSlash();
      else if(player.flames>=2) triggerTripleHeavyLineSlash();
      else triggerRegularArcSlash();
      isMouseDown=false; holdTimer=0;
    }
  }

  if(comboTimer>0){comboTimer--; if(comboTimer===0){combo=0;comboEl.textContent='0x';}}

  if(!ultimateState.active&&!megaState.active&&!cutscene.active){
    let dx=0,dy=0;
    if(keys.w)dy-=1; if(keys.s)dy+=1; if(keys.a)dx-=1; if(keys.d)dx+=1;
    if(dx!==0&&dy!==0){dx*=0.7071;dy*=0.7071;}
    player.vx+=dx*player.accel; player.vy+=dy*player.accel;
    player.vx*=player.friction; player.vy*=player.friction;
    player.x+=player.vx; player.y+=player.vy;
    player.x=Math.max(player.size/2,Math.min(canvas.width-player.size/2,player.x));
    player.y=Math.max(player.size/2,Math.min(canvas.height-player.size/2,player.y));
    if(Math.hypot(player.vx,player.vy)>1) player.trail.push({x:player.x,y:player.y,alpha:0.6});
    player.trail.forEach(t=>t.alpha-=0.06);
    player.trail=player.trail.filter(t=>t.alpha>0);
    player.angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);
    if(player.isAttacking){player.attackTimer--;if(player.attackTimer<=0)player.isAttacking=false;}
    if(player.parryCooldown>0)player.parryCooldown--;
    if(player.isParrying){player.parryTimer--;if(player.parryTimer<=0)player.isParrying=false;}
  }

  if(boss&&!boss.dead&&!ultimateState.active&&!megaState.active){
    boss.pulseTimer++;
    if(boss.hitFlash>0)boss.hitFlash--;
    const edx=player.x-boss.x,edy=player.y-boss.y,dist=Math.hypot(edx,edy);
    if(dist>0){boss.x+=(edx/dist)*boss.speed;boss.y+=(edy/dist)*boss.speed;}
    if(dist<(player.size/2+boss.size/2+10)){
      if(player.isParrying){
        player.isParrying=false;player.parryTimer=0;slowMoTimer=70;
        boss.x-=(edx/dist)*120;boss.y-=(edy/dist)*120;boss.hitFlash=15;
        const sparkX=player.x-(edx/dist)*(player.size/2+10),sparkY=player.y-(edy/dist)*(player.size/2+10);
        shockwaves.push({x:sparkX,y:sparkY,r:5,maxR:200,color:'#ffff00',width:10,alpha:1});
        for(let k=0;k<40;k++){
          const angle=Math.random()*Math.PI*2,speed=Math.random()*18+4;
          spawnParticle(sparkX,sparkY,Math.cos(angle)*speed,Math.sin(angle)*speed,['#ffff00','#ffea00','#ffc700'][Math.floor(Math.random()*3)],Math.random()*5+2,Math.floor(Math.random()*20+12),true);
        }
        spawnFloatingText(sparkX,sparkY-30,'DEFLECTED!','#ffea00');
        screenShake=30;hitStopFrames=5;
      }else if(dist<(player.size/2+boss.size/2)){
        player.hp-=1.2;screenShake=6;hpEl.textContent=Math.max(0,Math.ceil(player.hp));
        if(player.hp<=0){gameOver=true;createSparks(player.x,player.y,'#00f0ff',60);}
      }
    }
  }

  for(let i=shockwaves.length-1;i>=0;i--){
    const sw=shockwaves[i];sw.r+=(sw.maxR-sw.r)*0.25;sw.alpha*=0.85;
    if(sw.alpha<=0.02)shockwaves.splice(i,1);
  }
  for(let i=arcSlashes.length-1;i>=0;i--){arcSlashes[i].life--;if(arcSlashes[i].life<=0)arcSlashes.splice(i,1);}
  for(let i=fullScreenSlashes.length-1;i>=0;i--){fullScreenSlashes[i].life--;if(fullScreenSlashes[i].life<=0)fullScreenSlashes.splice(i,1);}

  for(let i=travelingSlashes.length-1;i>=0;i--){
    const wave=travelingSlashes[i];
    wave.x+=Math.cos(wave.angle)*wave.speed;wave.y+=Math.sin(wave.angle)*wave.speed;wave.life--;
    if(Math.random()<0.8)spawnParticle(wave.x,wave.y,(Math.random()-0.5)*4,(Math.random()-0.5)*4,wave.glowColor||'#00f0ff',Math.random()*4+2,14,true);
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(wave.hitEnemies.has(e.id))continue;
      if(Math.hypot(e.x-wave.x,e.y-wave.y)<=wave.width/2+e.size/2){
        wave.hitEnemies.add(e.id);e.hp-=wave.damage;e.hitFlash=10;
        e.x+=Math.cos(wave.angle)*40;e.y+=Math.sin(wave.angle)*40;createSparks(e.x,e.y,'#00f0ff',25);
        if(e.hp<=0){
          combo++;comboTimer=120;const points=e.scoreValue*Math.max(1,combo);
          score+=points;scoreEl.textContent=score;comboEl.textContent=`${combo}x`;
          spawnFloatingText(e.x,e.y,`+${points}`,'#00f0ff');createSparks(e.x,e.y,e.color,40);enemies.splice(j,1);
        }
      }
    }
    if(boss&&!boss.dead&&!wave.hitEnemies.has('creator')){
      if(Math.hypot(boss.x-wave.x,boss.y-wave.y)<=wave.width/2+boss.size/2){
        wave.hitEnemies.add('creator');
        applyBossDamage(wave.damage,'#00f0ff',wave.fromUltimate||false);
      }
    }
    if(wave.life<=0)travelingSlashes.splice(i,1);
  }

  const enemySpeedMult=slowMoTimer>0?0.2:1.0;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.hitFlash>0)e.hitFlash--;
    const edx=player.x-e.x,edy=player.y-e.y,dist=Math.hypot(edx,edy);
    if(!ultimateState.active&&!megaState.active&&dist>0){
      e.x+=(edx/dist)*e.speed*enemySpeedMult;e.y+=(edy/dist)*e.speed*enemySpeedMult;
    }
    if(!ultimateState.active&&!megaState.active&&dist<(player.size/2+e.size/2+14)){
      if(player.isParrying){
        player.isParrying=false;player.parryTimer=0;slowMoTimer=70;
        e.x-=(edx/dist)*150;e.y-=(edy/dist)*150;e.hitFlash=15;
        const sparkX=player.x-(edx/dist)*(player.size/2+10),sparkY=player.y-(edy/dist)*(player.size/2+10);
        shockwaves.push({x:sparkX,y:sparkY,r:5,maxR:200,color:'#ffff00',width:10,alpha:1});
        for(let k=0;k<40;k++){
          const angle=Math.random()*Math.PI*2,speed=Math.random()*18+4;
          spawnParticle(sparkX,sparkY,Math.cos(angle)*speed,Math.sin(angle)*speed,['#ffff00','#ffea00','#ffc700'][Math.floor(Math.random()*3)],Math.random()*5+2,Math.floor(Math.random()*20+12),true);
        }
        spawnFloatingText(sparkX,sparkY-30,'DEFLECTED!','#ffea00');
        screenShake=30;hitStopFrames=5;
      }else if(dist<(player.size/2+e.size/2)){
        player.hp-=0.6;screenShake=4;hpEl.textContent=Math.max(0,Math.ceil(player.hp));
        if(player.hp<=0){gameOver=true;createSparks(player.x,player.y,'#00f0ff',60);}
      }
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floatingTexts.length-1;i>=0;i--){
    const t=floatingTexts[i];t.y+=t.vy;t.life--;
    if(t.life<=0)floatingTexts.splice(i,1);
  }
  if(screenShake>0)screenShake*=0.85;
  updateFlamesUI();
}

function updateVisualsOnly(){
  for(let i=shockwaves.length-1;i>=0;i--){
    const sw=shockwaves[i];sw.r+=(sw.maxR-sw.r)*0.25;sw.alpha*=0.85;
    if(sw.alpha<=0.02)shockwaves.splice(i,1);
  }
  for(let i=fullScreenSlashes.length-1;i>=0;i--){fullScreenSlashes[i].life--;if(fullScreenSlashes[i].life<=0)fullScreenSlashes.splice(i,1);}
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floatingTexts.length-1;i>=0;i--){
    const t=floatingTexts[i];t.y+=t.vy;t.life--;
    if(t.life<=0)floatingTexts.splice(i,1);
  }
  for(let i=bossShards.length-1;i>=0;i--){
    const s=bossShards[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.15;s.rotation+=s.rotSpeed;s.life--;
    if(s.life<=0)bossShards.splice(i,1);
  }
  if(screenShake>0)screenShake*=0.85;
}

function drawKatana(glowColor,coreColor){
  ctx.fillStyle='#ffaa00';ctx.shadowBlur=8;ctx.shadowColor='#ffaa00';
  ctx.fillRect(player.size/2,-6,3,12);
  ctx.fillStyle=glowColor;ctx.shadowBlur=22;ctx.shadowColor=glowColor;
  ctx.fillRect(player.size/2+3,-2,48,4);
  ctx.fillStyle=coreColor;ctx.shadowBlur=6;ctx.shadowColor=coreColor;
  ctx.fillRect(player.size/2+3,-1,48,2);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  if(slowMoTimer>0||ultimateState.active||megaState.active||cutscene.active) ctx.filter='grayscale(40%) contrast(130%)';
  if(screenShake>0.5) ctx.translate((Math.random()-0.5)*screenShake,(Math.random()-0.5)*screenShake);

  ctx.strokeStyle='#141722';ctx.lineWidth=1;
  for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=0;y<canvas.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}

  player.trail.forEach(t=>{
    ctx.fillStyle=`rgba(0,240,255,${t.alpha*0.35})`;
    ctx.fillRect(t.x-player.size/2,t.y-player.size/2,player.size,player.size);
  });

  fullScreenSlashes.forEach(fs=>{
    const alpha=fs.life/fs.maxLife;
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=fs.glowColor;ctx.globalAlpha=alpha;ctx.lineWidth=fs.width;
    ctx.shadowBlur=35;ctx.shadowColor=fs.glowColor;
    ctx.beginPath();ctx.moveTo(fs.x1,fs.y1);ctx.lineTo(fs.x2,fs.y2);ctx.stroke();
    ctx.strokeStyle=fs.coreColor;ctx.lineWidth=fs.width*0.35;ctx.shadowBlur=12;ctx.shadowColor='#ffffff';
    ctx.beginPath();ctx.moveTo(fs.x1,fs.y1);ctx.lineTo(fs.x2,fs.y2);ctx.stroke();
    ctx.restore();
  });

  shockwaves.forEach(sw=>{
    ctx.save();ctx.beginPath();ctx.arc(sw.x,sw.y,sw.r,0,Math.PI*2);
    ctx.strokeStyle=sw.color;ctx.globalAlpha=sw.alpha;ctx.lineWidth=sw.width;
    ctx.shadowBlur=20;ctx.shadowColor=sw.color;ctx.stroke();ctx.restore();
  });

  arcSlashes.forEach(s=>{
    const progress=1-(s.life/s.maxLife),alpha=s.life/s.maxLife;
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.translate(s.x,s.y);ctx.rotate(s.angle);
    const currRadius=s.radius*(0.6+progress*0.4);
    ctx.beginPath();ctx.arc(0,0,currRadius,-s.arcAngle/2,s.arcAngle/2);
    ctx.strokeStyle=`rgba(0,240,255,${alpha*0.9})`;ctx.lineWidth=26*alpha;
    ctx.shadowBlur=30;ctx.shadowColor='#00f0ff';ctx.stroke();ctx.restore();
  });

  travelingSlashes.forEach(wave=>{
    const alpha=wave.life/wave.maxLife;
    if(wave.lineLength){
      const halfL=wave.lineLength/2;
      const lx1=wave.x-Math.cos(wave.angle)*halfL,ly1=wave.y-Math.sin(wave.angle)*halfL;
      const lx2=wave.x+Math.cos(wave.angle)*halfL,ly2=wave.y+Math.sin(wave.angle)*halfL;
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=alpha;
      ctx.strokeStyle=wave.glowColor||'#00f0ff';ctx.lineWidth=wave.lineWidth||12;
      ctx.shadowBlur=35;ctx.shadowColor=wave.glowColor||'#00f0ff';
      ctx.beginPath();ctx.moveTo(lx1,ly1);ctx.lineTo(lx2,ly2);ctx.stroke();
      ctx.strokeStyle=wave.coreColor||'#ffffff';ctx.lineWidth=(wave.lineWidth||12)*0.35;
      ctx.shadowBlur=12;ctx.shadowColor='#ffffff';
      ctx.beginPath();ctx.moveTo(lx1,ly1);ctx.lineTo(lx2,ly2);ctx.stroke();ctx.restore();
    }
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.translate(wave.x,wave.y);ctx.rotate(wave.angle);
    const halfW=wave.width/2;
    ctx.beginPath();
    ctx.moveTo(25,0);ctx.quadraticCurveTo(-15,halfW,-35,halfW*1.1);
    ctx.quadraticCurveTo(-10,0,-35,-halfW*1.1);ctx.quadraticCurveTo(-15,-halfW,25,0);
    ctx.fillStyle=`rgba(0,240,255,${alpha*0.95})`;ctx.shadowBlur=35;ctx.shadowColor='#00f0ff';ctx.fill();
    ctx.beginPath();
    ctx.moveTo(18,0);ctx.quadraticCurveTo(-8,halfW*0.6,-22,halfW*0.7);
    ctx.quadraticCurveTo(-5,0,-22,-halfW*0.7);ctx.quadraticCurveTo(-8,-halfW*0.6,18,0);
    ctx.fillStyle='#ffffff';ctx.fill();ctx.restore();
  });

  particles.forEach(p=>{
    ctx.save();
    if(p.glow){ctx.shadowBlur=12;ctx.shadowColor=p.color;}
    ctx.fillStyle=p.color;ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);ctx.restore();
  });

  enemies.forEach(e=>{
    ctx.save();
    if(e.hitFlash>0)ctx.fillStyle='#ffffff';
    else{ctx.fillStyle=e.color;ctx.shadowBlur=14;ctx.shadowColor=e.color;}
    ctx.fillRect(e.x-e.size/2,e.y-e.size/2,e.size,e.size);
    if(e.maxHp>1){
      ctx.shadowBlur=0;ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.fillRect(e.x-e.size/2,e.y-e.size/2-10,e.size,5);
      ctx.fillStyle='#00ffcc';
      ctx.fillRect(e.x-e.size/2,e.y-e.size/2-10,e.size*(e.hp/e.maxHp),5);
    }
    ctx.restore();
  });

  // Living boss
  if(boss&&!boss.dead){
    ctx.save();
    const pulse=1+Math.sin(boss.pulseTimer*0.08)*0.08, sz=boss.size*pulse;
    if(boss.hitFlash>0){ctx.fillStyle='#ffffff';ctx.shadowBlur=30;ctx.shadowColor='#ffffff';}
    else{ctx.fillStyle=boss.color;ctx.shadowBlur=25;ctx.shadowColor='#ff0066';}
    ctx.globalAlpha=0.35;ctx.beginPath();ctx.arc(boss.x,boss.y,sz*0.9,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.translate(boss.x,boss.y);ctx.rotate(Math.PI/4);ctx.fillRect(-sz/2,-sz/2,sz,sz);
    ctx.rotate(-Math.PI/4);ctx.translate(-boss.x,-boss.y);
    ctx.fillStyle='#ffffff';ctx.shadowBlur=15;ctx.shadowColor='#ff66aa';
    ctx.fillRect(boss.x-8,boss.y-8,16,16);
    ctx.shadowBlur=0;ctx.font='900 11px Arial';ctx.fillStyle='#ff3388';ctx.textAlign='center';
    ctx.fillText('THE CREATOR',boss.x,boss.y-sz/2-18);
    ctx.restore();
  }

  // Flying boss shards
  bossShards.forEach(s=>{
    ctx.save();
    ctx.translate(s.x,s.y);
    ctx.rotate(s.rotation);
    ctx.globalAlpha=Math.min(1,s.life/30);
    ctx.fillStyle=s.color;
    ctx.shadowBlur=12;ctx.shadowColor=s.color;
    ctx.fillRect(-s.size/2,-s.size/2,s.size,s.size);
    ctx.restore();
  });

  // Ultimate charge visuals
  if(ultimateState.phase==='BIG_PAUSE'){
    const progress=1-(ultimateState.timer/ultimateState.maxBigPause);
    const chargeRadius=player.size*(1+progress*8);
    const time=Date.now()*0.012;
    ctx.save();ctx.translate(player.x,player.y);ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=`rgba(0,240,255,${0.05+Math.sin(time*5)*0.04})`;
    ctx.fillRect(-canvas.width,-canvas.height,canvas.width*2,canvas.height*2);
    for(let r=1;r<=6;r++){
      ctx.save();ctx.rotate(time*(r%2===0?1.5:-1.5)*r);ctx.setLineDash([20+r*6,12]);
      ctx.beginPath();ctx.arc(0,0,chargeRadius*(r*0.3),0,Math.PI*2);
      ctx.strokeStyle=r%2===0?'#00f0ff':'#ffffff';ctx.lineWidth=5+progress*8;
      ctx.shadowBlur=40+progress*30;ctx.shadowColor='#00f0ff';ctx.stroke();ctx.restore();
    }
    for(let l=0;l<8;l++){
      const rayAng=(l/8)*Math.PI*2+time, rayLen=120+Math.sin(time*4+l)*40;
      ctx.beginPath();ctx.moveTo(Math.cos(rayAng)*rayLen,Math.sin(rayAng)*rayLen);ctx.lineTo(0,0);
      ctx.strokeStyle=l%2===0?'#ffffff':'#00f0ff';ctx.lineWidth=3+progress*5;
      ctx.shadowBlur=25;ctx.shadowColor='#00f0ff';ctx.stroke();
    }
    ctx.beginPath();ctx.arc(0,0,chargeRadius*0.7,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,240,255,${0.3+progress*0.6})`;ctx.shadowBlur=60;ctx.shadowColor='#ffffff';ctx.fill();
    ctx.restore();
  }

  if(megaState.phase==='SUPER_CHARGE'||megaState.phase==='CHARGE_UP'){
    const isSuper=megaState.phase==='SUPER_CHARGE';
    const maxT=isSuper?90:35;
    const progress=1-(megaState.timer/maxT);
    const time=Date.now()*0.02;
    ctx.save();ctx.translate(player.x,player.y);ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=`rgba(0,0,0,${0.4+Math.sin(time*8)*0.2})`;
    ctx.fillRect(-canvas.width,-canvas.height,canvas.width*2,canvas.height*2);
    ctx.fillStyle=`rgba(0,255,255,${0.15+progress*0.3})`;
    ctx.fillRect(-canvas.width,-canvas.height,canvas.width*2,canvas.height*2);
    for(let r=1;r<=8;r++){
      ctx.save();ctx.rotate(time*(r%2===0?2:-2)*(r*0.8));ctx.setLineDash([30,15,10,15]);
      ctx.beginPath();ctx.arc(0,0,(player.size*2)+progress*(r*45),0,Math.PI*2);
      ctx.strokeStyle=r%2===0?'#ffffff':'#00ffff';ctx.lineWidth=6+progress*10;
      ctx.shadowBlur=50+progress*40;ctx.shadowColor='#00ffff';ctx.stroke();ctx.restore();
    }
    for(let b=0;b<12;b++){
      const bang=(b/12)*Math.PI*2+time*2, blen=200+progress*300;
      ctx.beginPath();ctx.moveTo(Math.cos(bang)*blen,Math.sin(bang)*blen);ctx.lineTo(0,0);
      ctx.strokeStyle=b%2===0?'#ffffff':'#33f0ff';ctx.lineWidth=4+progress*8;
      ctx.shadowBlur=35;ctx.shadowColor='#00ffff';ctx.stroke();
    }
    ctx.beginPath();ctx.arc(0,0,(player.size*2)+progress*120,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,255,255,${0.35+progress*0.5})`;ctx.shadowBlur=90;ctx.shadowColor='#ffffff';ctx.fill();
    ctx.restore();
  }

  if(isMouseDown&&player.flames>=2&&player.flames<6&&!ultimateState.active&&!megaState.active&&!cutscene.active){
    const isPenta=player.flames>=4, time=Date.now()*0.003;
    ctx.save();ctx.translate(player.x,player.y);ctx.globalCompositeOperation='lighter';
    ctx.save();ctx.rotate(time);ctx.setLineDash([20,12]);
    ctx.beginPath();ctx.arc(0,0,player.size*(isPenta?2.6:2.0),0,Math.PI*2);
    ctx.strokeStyle=isPenta?'#ffffff':'#00f0ff';ctx.lineWidth=isPenta?5:3;
    ctx.shadowBlur=isPenta?35:25;ctx.shadowColor='#00f0ff';ctx.stroke();ctx.restore();
    const pulse=Math.sin(time*3)*8;
    ctx.beginPath();ctx.arc(0,0,player.size*1.3+pulse,0,Math.PI*2);
    ctx.fillStyle='rgba(0,150,255,0.25)';ctx.shadowBlur=40;ctx.shadowColor='#00f0ff';ctx.fill();
    ctx.restore();
  }

  // Player
  ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);
  ctx.shadowBlur=18;ctx.shadowColor=megaState.active||cutscene.active?'#00ffff':'#00f0ff';
  ctx.fillStyle=megaState.active||cutscene.active?'#ffffff':'#00f0ff';
  ctx.fillRect(-player.size/2,-player.size/2,player.size,player.size);ctx.restore();

  if(player.isAttacking){
    const swingProgress=(player.attackDuration-player.attackTimer)/player.attackDuration;
    const swingAngleOffset=(swingProgress-0.5)*Math.PI*0.95*player.swingDir;
    ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle+swingAngleOffset);
    drawKatana('#00f0ff','#ffffff');ctx.restore();
  }else if(player.isParrying){
    ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle+Math.PI/2.2);
    drawKatana('#ffea00','#ffffff');ctx.restore();
  }

  if(ultimateState.phase==='FINAL_SLASH_AND_BREAK'||megaState.phase==='FINAL_SLASH'||cutscene.phase==='BREAK'||cutscene.phase==='FINAL'||cutscene.phase==='SHATTER'){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='#ffffff';ctx.lineWidth=(megaState.phase==='FINAL_SLASH'||cutscene.phase==='SHATTER')?6:3.5;
    ctx.shadowBlur=30;ctx.shadowColor='#00f0ff';
    glassCracks.forEach(branch=>{
      ctx.beginPath();branch.forEach(seg=>{ctx.moveTo(seg.x1,seg.y1);ctx.lineTo(seg.x2,seg.y2);});ctx.stroke();
    });
    ctx.fillStyle='rgba(0,240,255,0.25)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();
  }

  if(cutscene.active&&(cutscene.phase==='DIALOGUE'||cutscene.phase==='FINAL')){
    ctx.save();ctx.fillStyle='rgba(0,0,10,0.45)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();
  }

  floatingTexts.forEach(t=>{
    ctx.save();ctx.font='900 16px Arial';ctx.fillStyle=t.color;
    ctx.shadowBlur=8;ctx.shadowColor=t.color;ctx.globalAlpha=t.life/40;
    ctx.fillText(t.text,t.x,t.y);ctx.restore();
  });

  ctx.restore();

  if(gameOver){
    ctx.save();
    ctx.fillStyle='rgba(5,5,10,0.88)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#ff0055';ctx.font='900 52px Arial';ctx.textAlign='center';
    ctx.shadowBlur=25;ctx.shadowColor='#ff0055';
    ctx.fillText('SYSTEM OVERRIDE',canvas.width/2,canvas.height/2-30);
    ctx.fillStyle='#ffffff';ctx.font='22px Arial';ctx.shadowBlur=0;
    ctx.fillText(`Final Score: ${score}`,canvas.width/2,canvas.height/2+20);
    ctx.fillStyle='#00f0ff';ctx.font='700 20px Arial';
    ctx.shadowBlur=10;ctx.shadowColor='#00f0ff';
    ctx.fillText('PRESS SPACE TO RESTART',canvas.width/2,canvas.height/2+75);
    ctx.restore();
  }
}

function loop(){update();draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
