<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Jogos</title>
</head>

<body>

    <h2>Cadastro de Jogos</h2>

    <form action="cadastro.php" method="POST">

        <label>Jogo:</label>
        <input type="text" name="jogo" required>

        <br><br>

        <label>Ação:</label>
        <input type="text" name="acao" required>

        <br><br>

        <label>Aventura:</label>
        <input type="text" name="aventura" required>

        <br><br>

        <label>RPG:</label>
        <input type="text" name="RPG">

        <br><br>

        <label>Estratégia:</label>
        <input type="text" name="estrategia" required>

        <br><br>

        <label>Simulação:</label>
        <input type="text" name="simulacao" required>

        <br><br>

        <label>Esporte:</label>
        <input type="text" name="esporte" required>

        <br><br>

        <label>Quebra-cabeça:</label>
        <input type="text" name="quebra_cabeca" required>

        <br><br>

        <button type="submit">
            Cadastrar Jogo
        </button>

    </form>

</body>
</html>
