<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </title>Cadastro do Funcionario</title>

    <link rel="stylesheet" href="style.css">

    </head>
    <body>

        <h1>Cadastro do Funcionario</h1>
            
        <form action="funcionario.php" method= "post">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="digite o seu nome">

             <br><br>

            <label for="matricula">Matricula:</label>
            <input type="text" id="matricula" name="matricula" placeholder="digite sua matricula">

            <br><br>

            <label for="funcao">Funcao:</label>
            <input type="text" id="funcao" name="funcao" placeholder="digite sua funcao">

             <br><br>

            <label for="departamento">Departamento:</label>
            <input type="text" id="departamento" name="departamento" placeholder="digite o seu departamento">

             <br><br>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" placeholder="digite sua idade">

             <br><br>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="digite seu cpf">

             <br><br>

            <label for="rg">RG:</label>
            <input type="text" id="rg" name="rg" placeholder="digite seu rg">

             <br><br>

            <label for="salario">Salario:</label>
            <input type="number" id="salario" name="salario" placeholder="digite seu salario">


            <br><br>

            <label for="endereco">Endereco:</label>
            <input type="text" id="endereco" name="endereco" placeholder="digite o seu endereco">

            <br><br>
            
            <label for="uf">Unidade Federativa:</label>
            <input type="caractere" id="uf" name="uf" placeholder="digite sua unidade federativa">

            <br><br>

            <label for="pais">Pais:</label>
            <input type="caractere" id="pais" name="pais" placeholder="digite o nome de seu pais">

            <br><br>

            <button type="submit">Cadastra Funcionario</button>

        </form>

    </body>
    </html>
