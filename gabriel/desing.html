<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Cadastro de Funcionário</h1>

    <div class="card-container">
        <form action="funcionario.php" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o seu nome">
                </div>

                <div class="form-group">
                    <label for="matricula">Matrícula:</label>
                    <input type="text" id="matricula" name="matricula" placeholder="Digite sua matrícula">
                </div>

                <div class="form-group">
                    <label for="rg">RG:</label>
                    <input type="text" id="rg" name="rg" placeholder="Digite seu RG">
                </div>

                <div class="form-group">
                    <label for="funcao">Função:</label>
                    <input type="text" id="funcao" name="funcao" placeholder="Digite sua função">
                </div>

                <div class="form-group">
                    <label for="salario">Salário:</label>
                    <input type="number" step="0.01" id="salario" name="salario" placeholder="Digite seu salário">
                </div>

                <div class="form-group">
                    <label for="departamento">Departamento:</label>
                    <input type="text" id="departamento" name="departamento" placeholder="Digite o seu departamento">
                </div>

                <div class="form-group">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" placeholder="Digite o seu endereço">
                </div>

                <div class="form-group">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade" placeholder="Digite sua idade">
                </div>

                <div class="form-group">
                    <label for="uf">UF:</label>
                    <input type="text" id="uf" name="uf" placeholder="Digite sua unidade federativa">
                </div>

                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF">
                </div>

                <div class="form-group">
                    <label for="pais">País:</label>
                    <input type="text" id="pais" name="pais" placeholder="Digite o nome de seu país">
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">Cadastrar</button>
                <button type="reset" class="btn-clear">Limpar</button>
            </div>
        </form>
    </div>

</body>
</html>
